<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<title>시스템 오류 :: 갇힌 아이돌</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- 배경: 앱 메인화면처럼 보이는 더미 레이어 -->
<div class="app-mock">
  <div class="app-mock__topbar">MY LOVE IDOL</div>
  <div class="app-mock__body">
    <div class="app-mock__card"></div>
    <div class="app-mock__card"></div>
    <div class="app-mock__card"></div>
  </div>
</div>

<!-- 1. FAB -->
<button id="fab" class="fab" type="button" aria-label="갇힌 아이돌 응답하기">
  <span class="fab__badge">[CRITICAL]</span>
  <span class="fab__bubble" id="fabBubble">💬 "야, 거기 너... 내 목소리 들려?"</span>
  <span class="fab__row">
    <span class="fab__icon">⚠️</span>
    <span class="fab__text">[ ⚠️ 갇힌 아이돌 응답하기 ]</span>
  </span>
</button>

<!-- CRT 글리치 전환 오버레이 -->
<div id="crtOverlay" class="crt-overlay"></div>

<!-- 2. 시스템 진입 메시지 레이어 -->
<div id="systemMessage" class="system-message">
  <p>차원 메신저 접속 완료.<br />대상과 연결되었습니다.</p>
</div>

<!-- 3. 스토리(비주얼노벨) 씬 -->
<div id="storyScene" class="story-scene">
  <div class="story-scene__scanlines"></div>
  <img class="story-scene__portrait" src="assets/rian.png" alt="리안" />
  <div class="story-box">
    <div class="story-box__speaker" id="storySpeaker">SYSTEM</div>
    <div class="story-box__line" id="storyLine"></div>
    <button class="story-box__next" id="storyNext" type="button">다음 ▶</button>
  </div>
</div>

<!-- 4. 채팅 씬 -->
<div id="chatScene" class="chat-scene">
  <div class="chat-header">
    <button id="chatClose" class="chat-header__close" type="button" aria-label="닫기">✕</button>
    <img class="chat-header__avatar" src="assets/rian.png" alt="리안" />
    <div class="chat-header__info">
      <div class="chat-header__name">리안 <span class="chat-header__ping"></span></div>
      <div class="chat-header__status" id="chatStatus">연결 상태: 불안정 · D-3</div>
    </div>
  </div>
  <div class="chat-log" id="chatLog"></div>
  <form class="chat-input" id="chatForm">
    <input id="chatInput" class="chat-input__field" type="text" placeholder="메시지를 입력..." autocomplete="off" />
    <button class="chat-input__send" type="submit">전송</button>
  </form>
</div>

<script src="app.js"></script>
</body>
</html>
